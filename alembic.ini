# Alembic configuration for the TradingEngineResearch persistence layer (Phase 6 item 2).
# The database URL is resolved at runtime in migrations/env.py from the TradingEngineResearch
# settings (ENGINE_PERSISTENCE__DATABASE_URL / state_dir), so it is left blank
# here. Run from the TradingEngineResearch/ directory: `alembic upgrade head`.
# NB: the script dir is `migrations/`, not `alembic/`, so it cannot shadow the
# installed `alembic` package on the pythonpath=["."] sys.path.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# ── TradingEngineResearch — packaging, dependencies & tooling ──────────────────
# Authoritative project definition. See ROADMAP.md Phase 0.
#
#   Install (quant core, runtime only):   pip install -e .
#   Install (dev: tests + lint + types):  pip install -e ".[dev]"
#   Reproducible / exact validated env:    pip install -e ".[dev]" -c constraints.txt
#   Everything incl. optional engines:     pip install -e ".[all]" -c constraints.txt
#
# Editable install note: the project uses FLAT top-level packages (core, data, …).
# The default (lenient) editable install maps ONLY the declared packages onto an
# import finder, so it does NOT place the project root on sys.path — verified that
# the stdlib `secrets` module is not shadowed by the local `secrets/` dir. For an
# extra safeguard you may force strict mode (a symlink/redirect tree of just the
# declared files):
#   pip install -e . --config-settings editable_mode=strict

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingengineresearch"
version = "6.0.0"
description = "Systematic-trading research platform: a fail-closed engine plus a pre-registered, default-deny alpha-search programme"
readme = "README.md"
requires-python = ">=3.11"        # validated on CPython 3.13; floor kept broad for the modern typing used
license = { text = "Source-available, all rights reserved. See LICENSE" }
authors = [{ name = "Leo Y. Zhang" }]
keywords = ["quant", "systematic-trading", "portfolio-optimization", "risk", "engine"]
classifiers = [
    "Private :: Do Not Upload",                       # guard against accidental PyPI publish
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]

# ── Core runtime dependencies (the quant engine; required for the 327-test suite) ──
# Upper bounds guard the ABI-sensitive scientific stack (numpy/scipy/scikit-learn)
# against unvalidated major releases. Exact validated pins live in constraints.txt.
dependencies = [
    "numpy>=1.26,<3",            # validated 2.2.1
    "pandas>=2.2,<3",            # validated 2.2.3
    "scipy>=1.14,<2",            # validated 1.17.1 (CVaR LP via scipy.optimize.linprog HiGHS)
    "scikit-learn>=1.5,<2",      # validated 1.9.0
    "pydantic>=2.9,<3",          # validated 2.10.4 (9 v2 data contracts)
    "arch>=7.1,<9",              # validated 8.0.0  (GJR-GARCH)
    "statsmodels>=0.14,<1",      # validated 0.14.6 (HAR-RV)
    "hmmlearn>=0.3,<1",          # validated 0.3.3  (regime HMM)
    "pydantic-settings>=2.6,<3", # validated 2.7.0  (central config, core/config.py)
]

[project.optional-dependencies]
# FinBERT sentiment — optional; nlp/finbert_scorer.py degrades to a lexicon fallback.
nlp = ["transformers>=4.44,<6", "torch>=2.13", "psutil>=5.9,<8"]
# Optional ML booster — core/ml_return_model.py falls back to sklearn GradientBoosting.
boost = ["lightgbm>=4,<5"]
# Optional nonlinear Ledoit-Wolf shrinkage — optimizer falls back to linear LW.
shrinkage = ["nlshrink>=0.2"]
# Baseline FastAPI app (not yet extracted into the working tree — future phase).
app = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    # pydantic-settings is now a core dependency (central config) — see [project.dependencies].
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
]
# Broker connectivity (broker/ibkr.py — future phase).
brokers = ["ib-insync>=0.9.86,<1", "alpaca-py>=0.30,<1"]
# Market-data ingestion (future phase).
ingestion = ["requests>=2.32,<3", "aiohttp>=3.10,<4", "yfinance>=1.0,<2", "pyarrow>=25,<26"]
# Encrypted secrets vault (Phase 6).
vault = ["cryptography>=48.0.1,<50"]
# SQL persistence backend (Phase 6 — ops/state_store.py SqlStateStore + Alembic).
persistence = ["sqlalchemy>=2,<3", "alembic>=1.13,<2"]
# Development toolchain.
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "mypy>=1.11,<3",
    "ruff>=0.6,<1",
    "pyarrow>=25,<26",   # lets the dev/CI test env exercise the insider parquet cache (data.insider_ingestion)
]
# Everything optional that is runtime-relevant (excludes dev tooling).
all = ["tradingengineresearch[nlp,boost,shrinkage,app,brokers,ingestion,vault,persistence]"]

# ── Package discovery (flat top-level layout, rooted at this dir) ──────────────
[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*", "data*", "research*", "strategies*", "nlp*",
    "execution*", "learning*", "ops*", "broker*", "backtesting*", "monitoring*",
]
exclude = [
    "tests*", "backend*", "launcher*", "frontend*",
    "upgrade-spec*", "secrets*",
]

# ── pytest ─────────────────────────────────────────────────────────────────────
#   * pythonpath=["."]            → puts the project root on sys.path for both
#                                    `pytest` and `python -m pytest` (the source uses
#                                    top-level `import core/data/...` with no path hacks).
#   * testpaths=["tests"]         → bare `pytest` collects ONLY the quant-core suite.
#   * --import-mode=importlib     → imports each test module under a unique name without
#                                    binding a shared top-level `tests` package.
# NOTE: import mode is NOT a valid ini key (it warns); it must go through addopts.
# NOTE: do not bake --cov into addopts (keeps bare `pytest` fast and cov-optional).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-config"
norecursedirs = [".git", "*_cache", ".*_cache", ".hypothesis", "node_modules", "secrets"]

# ── coverage (pytest-cov reads fail_under from here when --cov is active) ───────
[tool.coverage.run]
branch = true
source = ["core", "data", "research", "strategies", "execution", "learning", "ops", "nlp", "backtesting", "broker"]
# The omit list below is AUTHORED, not inferred. Two earlier attempts to derive it with a
# regex were wrong -- one would have excluded `riskparity.py`, a module that had just been
# given sixteen tests -- so the rule is stated here and the list is reviewed by hand.
#
# THE RULE: a file under research/ stays measured if it is reachable, transitively, from
# the test suite or from a production package (core, data, strategies, execution, learning,
# ops, nlp, backtesting, broker). Everything below is reachable from neither: it is a
# one-shot study runner whose correctness is gated by its pre-registration and its result
# document, not by unit tests. 48 of the 84 research modules stay measured; these 36 do not.
# (The counts previously read "41 of 84 ... these 37"; both were wrong -- they were written
# by hand mid-edit and never added up to 84. The figures above are machine-checked.)
#
# Why THIS LIST is not a lowered bar. `fail_under` was set to 80 against a baseline of 88%
# measured when this `source` list did NOT contain the overnight study scripts. They were
# committed later, joined the measured surface, and dropped the number to 53.72% without a
# single test being lost. Naming them here restores the scope the floor was calibrated for.
# (The FLOOR itself was separately lowered to 70 on 2026-08-01 because even with this list
# the suite reaches only 72.00% in CI -- see the note above `fail_under`. That was a real
# lowering of the bar and is argued as such there. The two changes are independent: this
# list fixes what is measured, that decision fixes what is demanded of it.)
#
# ruff and mypy still cover ALL of research/ and MUST keep doing so: ruff over exactly this
# directory is what caught a fabricated diagnostic (a hardcoded 0.372 printed as a computed
# share, surfaced by F841). Do not answer a lint problem by excluding these files there too.
#
# Adding a file here is a claim that nothing imports it. That claim is no longer left to
# hand-checking: tests/test_coverage_omit_list.py walks the real import graph and fails if
# any entry below is reachable from the suite or from a production package. It is what
# would have caught `institutional_flow` the day the test landing made it measured.
omit = [
  "*/__init__.py",
  "tests/*",
  "research/memguard.py",
  "research/sleeves/_convexity/convexity_run.py",
  "research/sleeves/_lowvol_verify/attack1_forced_exits.py",
  "research/sleeves/_lowvol_verify/attack2_exit_forensics.py",
  "research/sleeves/_lowvol_verify/attack3_delisting_repair.py",
  "research/sleeves/_lowvol_verify/attack4_statistics.py",
  "research/sleeves/_lowvol_verify/attack5_structure.py",
  "research/sleeves/_lowvol_verify/attack6_pit.py",
  "research/sleeves/_lowvol_verify/attack7_final.py",
  "research/sleeves/_lowvol_verify/attack8_spread.py",
  "research/sleeves/_lowvol_verify/build_frame.py",
  "research/sleeves/_lowvol_verify/check_repro.py",
  "research/sleeves/_lowvol_verify/instrumented.py",
  "research/sleeves/_pair_deflation/controls.py",
  "research/sleeves/_pair_deflation/pair_deflation.py",
  "research/sleeves/_portfolio/extract_lowvol_corrected_monthly.py",
  "research/sleeves/_portfolio/extract_lowvol_monthly.py",
  "research/sleeves/_portfolio/portfolio_attack_lowvol_regime.py",
  "research/sleeves/_portfolio/portfolio_attack_trend_passive.py",
  "research/sleeves/_portfolio/portfolio_correlation.py",
  "research/sleeves/_portfolio/portfolio_decision.py",
  "research/sleeves/_portfolio/portfolio_longhistory_books.py",
  "research/sleeves/_portfolio/portfolio_window_control.py",
  "research/sleeves/_survivor/survivor_verification_supp.py",
  "research/sleeves/breadth_ladder.py",
  "research/sleeves/breadth_neff.py",
  "research/sleeves/breadth_universe.py",
  "research/sleeves/insider_clustering.py",
  # institutional_flow.py was on this list and has been REMOVED: a test importing it
  # landed while the list was being written, which makes it reachable from the suite
  # and so measured, by the rule above. Exactly the failure this list is meant to
  # avoid -- do not re-add it without re-checking that nothing imports it.
  "research/sleeves/lowvol_retest_data.py",
  "research/sleeves/lowvol_retest_run.py",
  "research/sleeves/lowvol_retest_sensitivity.py",
  "research/sleeves/lowvol_retest_verify.py",
  "research/sleeves/multiasset_defensive_run.py",
  "research/sleeves/multiasset_defensive_verify.py",
  "research/sleeves/multiasset_value_verify.py",
  "research/sleeves/riskparity_run.py",
]

[tool.coverage.report]
# LOWERED 80 -> 70 on 2026-08-01, by the operator, deliberately. This IS a lowered bar and
# the previous note claiming otherwise is corrected below; pretending it is a re-scoping
# would be the dishonest version of this change.
#
# Why. With the authored omit list in place the suite measures 72.00% in CI and 75.15%
# locally (CI run 30700426327 / 30700974772; CI reads lower because ~35 tests skip there
# for want of sqlalchemy, alembic and the multiasset parquet). Reaching 80 needs roughly
# 1,475 more covered statements-plus-branches out of a denominator of 18,429, and that gap
# sits almost entirely in six study modules whose runner bodies are untested BY DESIGN --
# their correctness is gated by a pre-registration and a result document. So the 80 floor
# was unreachable without either testing one-shot scripts or hiding live modules, and a
# gate that can never pass is a gate that gets ignored. 70 is a floor that actually holds.
#
# Why 70 and not 72. The measured CI number IS 72.00, so a floor of 72 sits exactly on the
# measurement and would fail on rounding alone. Coverage also jitters run to run (75.16 ->
# 75.15 locally on identical measured code) because the Hypothesis suite explores different
# branches, and the CI-vs-local spread moves whenever an optional dependency changes what
# skips. 70 leaves ~2 points of headroom, which is enough to absorb that without being so
# slack it stops catching a real regression.
#
# This is a floor, not a target. If the six modules ever get real fixtures, raise it.
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# ── ruff (lint only; default rule set, matching the previously-verified clean state) ──
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["upgrade-spec", "secrets"]

# ── mypy ────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["core", "data", "research", "strategies", "nlp", "execution", "learning", "ops", "backtesting", "broker"]
exclude = "(?x)(^|/)(upgrade-spec|secrets|tests)/"
